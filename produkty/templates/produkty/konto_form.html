{% extends 'produkty/base.html' %}

{% block title %}{{ akcja }} Konto{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="mb-3">
        <a href="{% url 'produkty:konta_lista' %}" class="btn btn-outline-secondary"><i class="fas fa-arrow-left"></i> Wróć do listy kont</a>
    </div>

    <div class="card shadow-sm max-w-md mx-auto" style="max-width: 500px;">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">{{ akcja }} Konto Użytkownika</h3>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success w-100 mt-3"><i class="fas fa-save"></i> Zapisz</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
