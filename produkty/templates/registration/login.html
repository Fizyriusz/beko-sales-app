{% extends 'produkty/base.html' %}

{% block title %}Logowanie - Beko Ambassador{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5 col-lg-4 px-3">
        <div class="card border-0 shadow-lg" style="border-radius: 16px; overflow: hidden; background-color: #ffffff;">
            <!-- Brand Accent Header -->
            <div class="text-center py-4 px-3 text-white" style="background-color: #002450;">
                <h3 class="mb-1 fw-bold" style="letter-spacing: 0.5px;">Beko Ambassador</h3>
                <p class="mb-0 text-white-50" style="font-size: 0.9rem;">Witaj! Zaloguj się do swojego konta</p>
            </div>
            
            <div class="card-body p-4">
                <form method="post" autocomplete="off">
                    {% csrf_token %}
                    
                    {% if form.errors %}
                    <div class="alert alert-danger border-0 text-center py-2 mb-4" role="alert" style="border-radius: 8px; font-size: 0.9rem;">
                        <i class="fas fa-exclamation-circle me-2"></i> Niepoprawny login lub hasło.
                    </div>
                    {% endif %}
                    
                    <!-- Username Field -->
                    <div class="mb-3">
                        <label for="id_username" class="form-label text-muted fw-semibold small" style="letter-spacing: 0.3px;">Nazwa użytkownika</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted" style="border-radius: 8px 0 0 8px; border-color: #dee2e6;">
                                <i class="fas fa-user" style="width: 16px;"></i>
                            </span>
                            <input type="text" 
                                   name="username" 
                                   id="id_username" 
                                   required 
                                   class="form-control bg-light border-start-0 py-2" 
                                   placeholder="Wpisz nazwę użytkownika" 
                                   style="border-radius: 0 8px 8px 0; border-color: #dee2e6; font-size: 0.95rem; outline: none; box-shadow: none;"
                            >
                        </div>
                    </div>
                    
                    <!-- Password Field -->
                    <div class="mb-4">
                        <label for="id_password" class="form-label text-muted fw-semibold small" style="letter-spacing: 0.3px;">Hasło</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted" style="border-radius: 8px 0 0 8px; border-color: #dee2e6;">
                                <i class="fas fa-lock" style="width: 16px;"></i>
                            </span>
                            <input type="password" 
                                   name="password" 
                                   id="id_password" 
                                   required 
                                   class="form-control bg-light border-start-0 py-2" 
                                   placeholder="Wpisz hasło" 
                                   style="border-radius: 0 8px 8px 0; border-color: #dee2e6; font-size: 0.95rem; outline: none; box-shadow: none;"
                            >
                        </div>
                    </div>
                    
                    <!-- Submit Button -->
                    <button type="submit" 
                            class="btn w-100 py-2 text-white fw-bold shadow-sm" 
                            style="background-color: #002450; border-radius: 8px; transition: all 0.3s; font-size: 1rem; border: none;"
                            onmouseover="this.style.backgroundColor='#003366'; this.style.transform='translateY(-1px)';" 
                            onmouseout="this.style.backgroundColor='#002450'; this.style.transform='none';"
                    >
                        Zaloguj się
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    /* Styling focused state of input group */
    .input-group:focus-within .input-group-text {
        border-color: #002450 !important;
        background-color: #ffffff !important;
        color: #002450 !important;
    }
    .input-group:focus-within .form-control {
        border-color: #002450 !important;
        background-color: #ffffff !important;
    }
</style>
{% endblock %}
